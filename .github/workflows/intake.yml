name: intake

on:
  issues:
    types: [opened, edited, labeled]

concurrency:
  group: gitclaw-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      ((github.event.action == 'opened' || github.event.action == 'edited') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'gitclaw' &&
       github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GITCLAW_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install runtime
        run: |
          npm install -g @github/copilot
          pip install yamlgraph pytest

      - name: Verify control bundle
        run: python -m tools.control_bundle

      - name: Classify exact command
        id: command
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python -m tools.executor_contract classify >> "$GITHUB_OUTPUT"

      - name: Immutable owner request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          FEATURE="issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          REQUEST_SHA256="$(python -m tools.request_contract write "$FEATURE" "${{ github.event.issue.number }}")"
          echo "FEATURE=$FEATURE" >> "$GITHUB_ENV"
          echo "REQUEST_PATH=features/$FEATURE/request.json" >> "$GITHUB_ENV"
          echo "REQUEST_SHA256=$REQUEST_SHA256" >> "$GITHUB_ENV"

      - name: Reference assets
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          SET_NAME="$(python -m tools.reference_assets select)"
          REFERENCE_SHA256=""
          REFERENCE_PATH=""
          if [ -n "$SET_NAME" ]; then
            REFERENCE_SHA256="$(python -m tools.reference_assets stage "$FEATURE" "$SET_NAME")"
            REFERENCE_PATH="features/$FEATURE/reference/manifest.json"
          fi
          echo "REFERENCE_PATH=$REFERENCE_PATH" >> "$GITHUB_ENV"
          echo "REFERENCE_SHA256=$REFERENCE_SHA256" >> "$GITHUB_ENV"

      - name: Freeze input commit
        run: |
          git config user.name "gitclaw-bot"
          git config user.email "actions@github.com"
          git add "features/$FEATURE/request.json"
          if [ -n "$REFERENCE_PATH" ]; then git add "features/$FEATURE/reference"; fi
          git commit -m "chore(gitclaw): issue #${{ github.event.issue.number }} input"
          echo "INPUT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Resolve review head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXPECTED_PR_HEAD=""
          if [ "${{ steps.command.outputs.operation }}" = review ]; then
            EXPECTED_PR_HEAD="$(gh pr view '${{ steps.command.outputs.pr }}' --json headRefOid -q .headRefOid)"
          fi
          echo "EXPECTED_PR_HEAD=$EXPECTED_PR_HEAD" >> "$GITHUB_ENV"

      - name: Configure read-only adapter context
        env:
          # This credential must have Copilot access and no repository-write access.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        run: printf '%s' "$COPILOT_GITHUB_TOKEN" | gh auth login --with-token

      - name: Run generic agent
        env:
          # Must be a dedicated Copilot credential with no repository-write access.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        run: |
          yamlgraph graph run gitclaw.yaml \
            --var request_path="$REQUEST_PATH" \
            --var request_sha256="$REQUEST_SHA256" \
            --var operation="${{ steps.command.outputs.operation }}" \
            --var target="${{ steps.command.outputs.target }}" \
            --var pr="${{ steps.command.outputs.pr }}" \
            --var current_head="$INPUT_HEAD" \
            --var reference_path="$REFERENCE_PATH" \
            --var reference_sha256="$REFERENCE_SHA256" \
            --var expected_pr_head="$EXPECTED_PR_HEAD" \
            --full

      - name: Verify generic executor artifacts
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: >-
          python -m tools.executor_contract verify "$FEATURE" "$REQUEST_SHA256"
          "$INPUT_HEAD" "$EXPECTED_PR_HEAD"

      - name: Publish verified result
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m tools.executor_publish tmp/execution-report.json
          "${{ github.repository }}" "${{ github.event.issue.number }}"
