name: cron

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  YAMLGRAPH_TASK: ${{ vars.YAMLGRAPH_TASK }}

concurrency:
  group: gitclaw-cron
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: pip install yamlgraph

      - name: Validate task
        run: |
          case "$YAMLGRAPH_TASK" in
            ""|/*|..|../*|*/..|*/../*) exit 1 ;;
          esac
          case "$YAMLGRAPH_TASK" in
            *.yaml) ;;
            *) exit 1 ;;
          esac
          test -f "$YAMLGRAPH_TASK"
          test ! -L "$YAMLGRAPH_TASK"
          git ls-files --error-unmatch -- "$YAMLGRAPH_TASK" >/dev/null

      - name: Run task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          yamlgraph graph run "$YAMLGRAPH_TASK" --full
