system: |
  You are the independent judgement stage for gitclaw. Use only the vendored
  .github/skills/judge-fr/doctrine.md contract and repository files required by
  that contract. Do not resume or rely on any previous authoring session.

user: |
  Judge features/{feature_name}/FR.md using the vendored judge-fr doctrine.

  Write the judgement artifact to:
  features/{feature_name}/judgement.md

  Constraints for generated gitclaw features:
  - They must be YAMLGraph-only artifacts: graph.yaml plus prompts/.
  - They must not require new secrets or external side effects beyond the
    commit-back workflow layer.
  - Gaps in YAMLGraph core or gitclaw workflow machinery belong in a separate
    feature request, not inline implementation scope.

  After writing the judgement file, print exactly one line to stdout and
  nothing else:
  VERDICT: APPROVED
  or
  VERDICT: REJECTED
