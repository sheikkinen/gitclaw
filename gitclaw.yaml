version: "1.0"
name: gitclaw-generic-executor
description: Run one generic Copilot CLI execution node against a verified request artifact.

prompts_relative: true
prompts_dir: prompts

state:
  request_path: str
  request_sha256: str
  operation: str
  target: str
  pr: str
  current_head: str
  reference_path: str
  reference_sha256: str
  expected_pr_head: str

nodes:
  execute:
    type: copilot
    backend: cli
    prompt: generic
    cli_flags:
      allow_all_paths: true
      allow_all_tools: true
      model: claude-sonnet-5
    timeout: 900
    variables:
      request_path: "{state.request_path}"
      request_sha256: "{state.request_sha256}"
      operation: "{state.operation}"
      target: "{state.target}"
      pr: "{state.pr}"
      current_head: "{state.current_head}"
      reference_path: "{state.reference_path}"
      reference_sha256: "{state.reference_sha256}"
      expected_pr_head: "{state.expected_pr_head}"
    state_key: execution_result

edges:
  - from: START
    to: execute
  - from: execute
    to: END
